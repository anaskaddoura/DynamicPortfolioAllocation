name: PR Code Check for Python ML/AI projects

# 1. Trigger when a Pull Request is opened or updated
on:
  pull_request:
    branches:
      - main

jobs:
  validate-code:
    runs-on: ubuntu-latest

    steps:
      # 2. Pull down your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3. Set up the exact Python version used locally
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Change to local version
          cache: 'pip'           # Speeds up future PRs by caching dependencies

      # 4. Install dependencies
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Run your test suite
      - name: Run Tests
        run: |
          pytest
